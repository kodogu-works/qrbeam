name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    env:
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, build, and inspect artifact
        run: npm run check

      - name: Check reproducible build
        run: |
          cp dist/SHA256SUMS "$RUNNER_TEMP/qrbeam-SHA256SUMS"
          npm run build
          cmp "$RUNNER_TEMP/qrbeam-SHA256SUMS" dist/SHA256SUMS
          npm run verify

      - name: Install Chromium and system dependencies
        if: matrix.node == 26
        run: npx playwright install --with-deps chromium

      - name: Run offline file browser E2E
        if: matrix.node == 26
        run: npm run test:browser

      - name: Upload build artifacts
        if: matrix.node == 26
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qrbeam-build
          path: |
            dist/qrbeam.html
            dist/SHA256SUMS
            dist/build.json
            dist/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload available browser failure diagnostics
        if: failure() && matrix.node == 26
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
